<!DOCTYPE html>
<!-- 
    1. Se añade el namespace de Thymeleaf (xmlns:th).
    2. Los namespaces de JSF han sido eliminados.
-->
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login - Sistema SENA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap 5 CSS (sin cambios) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" />

    <!-- 
        3. <h:outputStylesheet> se reemplaza por un <link> estándar.
        Thymeleaf usa la sintaxis @{...} para generar URLs relativas al contexto.
    -->
    <link rel="stylesheet" th:href="@{/css/global.css}" />

    <!-- Font Awesome (sin cambios) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4 col-xl-3">
                <div class="card shadow-lg border-0 fade-in">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <i class="fas fa-graduation-cap fa-3x mb-3"></i>
                        <h2 class="mb-0">Sistema SENA</h2>
                        <p class="mb-0 opacity-75">Iniciar Sesión</p>
                    </div>
                    <div class="card-body p-4">
                        <!-- 
                            4. <h:form> se convierte en un <form> HTML estándar.
                            5. El 'action' ya no apunta a un método de bean (#{login.iniciarSesion}).
                               Apunta a la URL que Spring Security intercepta: '/perform_login'.
                            6. Se añade method="post".
                        -->
                        <form th:action="@{/perform_login}" method="post" class="needs-validation" novalidate>

                            <!-- 
                                7. Reemplazo de <h:messages>. Thymeleaf verifica parámetros en la URL.
                                Spring Security añade "?error" si el login falla y "?logout" si se cierra sesión.
                            -->
                            <div th:if="${param.error}" class="alert alert-danger">
                                Usuario o contraseña incorrectos.
                            </div>
                            <div th:if="${param.logout}" class="alert alert-success">
                                Has cerrado sesión exitosamente.
                            </div>

                            <!-- Campo Usuario -->
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user me-2"></i>Usuario
                                </label>
                                <!--
                                    8. <h:inputText> se convierte en un <input> estándar.
                                    9. El atributo 'name' ES CRÍTICO. Debe ser "username" por convención de Spring Security.
                                    10. Se elimina 'value', ya que la vista es stateless.
                                    11. La validación 'required' ahora es un atributo estándar de HTML5.
                                -->
                                <input type="text" id="username" name="username" class="form-control"
                                    placeholder="Ingrese su correo electrónico" required autofocus />
                            </div>

                            <!-- Campo Contraseña -->
                            <div class="mb-4">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-2"></i>Contraseña
                                </label>
                                <!--
                                    12. <h:inputSecret> se convierte en <input type="password">.
                                    13. El atributo 'name' ES CRÍTICO. Debe ser "password".
                                -->
                                <input type="password" id="password" name="password" class="form-control"
                                    placeholder="Ingrese su contraseña" required />
                            </div>

                            <!-- Botón de Login -->
                            <div class="d-grid">
                                <!-- 
                                    14. <h:commandButton> se convierte en <button type="submit">.
                                    No necesita 'action' porque está dentro de un <form>.
                                -->
                                <button type="submit" class="btn btn-primary btn-lg">Ingresar al Sistema</button>
                            </div>

                            <div class="text-center mt-4">
                                <small class="text-muted">
                                    <i class="fas fa-shield-alt me-1"></i>
                                    Sistema seguro de gestión académica
                                </small>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer bg-light text-center py-3">
                        <small class="text-muted">
                            © 2024 SENA - Todos los derechos reservados
                        </small>
                    </div>
                </div>
            </div>
        </div>

        <!-- JS (sin cambios en su mayoría) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // El script de validación de Bootstrap sigue siendo útil para los estilos visuales.
            (function () {
                'use strict';
                window.addEventListener('load', function () {
                    var forms = document.querySelectorAll('.needs-validation');
                    Array.prototype.forEach.call(forms, function (form) {
                        form.addEventListener('submit', function (event) {
                            if (!form.checkValidity()) {
                                event.preventDefault();
                                event.stopPropagation();
                            }
                            form.classList.add('was-validated');
                        }, false);
                    });
                }, false);
            })();

            // Animación de carga (actualizada para buscar un <button>)
            document.addEventListener('DOMContentLoaded', function () {
                const submitBtn = document.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.closest('form').addEventListener('submit', function () {
                        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Iniciando sesión...';
                        submitBtn.disabled = true;
                    });
                }
            });
        </script>
</body>

</html>
