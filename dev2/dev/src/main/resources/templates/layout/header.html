<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <!-- Este head es solo para que el fragmento sea válido, no se usará al incluirlo -->
</head>

<body>
  <!-- 
      1. Se define un fragmento con th:fragment="header".
      Esto nos permite incluir solo esta sección en otras páginas.
    -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm" th:fragment="header">
    <div class="container">
      <!-- 2. <h:link> se convierte en <a> con th:href -->
      <a th:href="@{/welcome}" class="navbar-brand">
        <i class="fas fa-graduation-cap me-2"></i>
        Sistema SENA
      </a>

      <div class="navbar-nav ms-auto d-flex align-items-center">
        <!-- 3. Solo se muestra si el usuario está autenticado -->
        <div class="dropdown" sec:authorize="isAuthenticated()">
          <button class="user-dropdown-btn dropdown-toggle d-flex align-items-center" type="button" id="userDropdown"
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-user-circle me-2"></i>
            <!-- 4. Se usa el objeto currentUser inyectado por el ControllerAdvice -->
            <span>Bienvenido, <span th:text="${currentUser != null ? currentUser.nombre : ''}"></span></span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end user-dropdown-menu" aria-labelledby="userDropdown">
            <!-- Header del desplegable -->
            <li>
              <div class="dropdown-header user-dropdown-header" th:if="${currentUser != null}">
                <h6 class="mb-1" th:text="${currentUser.nombre + ' ' + currentUser.apellido}"></h6>
                <small th:text="${currentUser.email}"></small>
              </div>
            </li>
            <li>
              <div class="dropdown-divider"></div>
            </li>

            <!-- 5. Los commandButton se convierten en enlaces o botones de formulario -->
            <li>
              <a class="dropdown-item" th:href="@{/perfil}"><i class="fas fa-user-cog me-2"></i>Mi Perfil</a>
            </li>
            <li>
              <a class="dropdown-item" th:href="@{/welcome}"><i class="fas fa-home me-2"></i>Inicio</a>
            </li>

            <li>
              <div class="dropdown-divider"></div>
            </li>

            <!-- 6. El logout es un formulario que hace POST a /perform_logout -->
            <li>
              <form th:action="@{/perform_logout}" method="post" class="d-inline">
                <button type="submit" class="dropdown-item text-danger">
                  <i class="fas fa-sign-out-alt me-2"></i>Cerrar sesión
                </button>
              </form>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
</body>

</html>
