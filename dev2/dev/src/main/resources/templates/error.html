<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <!-- 1. Se añaden los namespaces de Thymeleaf y Spring Security -->
  <title>Error - Sistema SENA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSS (sin cambios) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="bg-light">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-danger text-white text-center">
            <h1 class="h3 mb-0">
              <i class="fas fa-exclamation-triangle me-2"></i> Error del Sistema
            </h1>
          </div>
          <div class="card-body text-center">
            <!-- 2. Spring Boot pasa variables de error al modelo. Podemos mostrarlas. -->
            <h2 class="h4" th:text="|Error ${status} - ${error}|">Ha ocurrido un error</h2>
            <p class="text-muted" th:text="${message}">No se pudo procesar la solicitud.</p>

            <div class="d-grid gap-2">
              <!-- 3. <h:link> se convierte en <a> con th:href.
                  4. El 'rendered' se reemplaza por sec:authorize="isAuthenticated()" de Spring Security.
              -->
              <a th:href="@{/welcome}" class="btn btn-primary" sec:authorize="isAuthenticated()">
                <i class="fas fa-home me-2"></i>Volver al Inicio
              </a>
              <!-- 5. La condición opuesta se maneja con sec:authorize="isAnonymous()" -->
              <a th:href="@{/login}" class="btn btn-outline-secondary" sec:authorize="isAnonymous()">
                <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- JS (sin cambios) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
