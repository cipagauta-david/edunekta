<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Error 403 - Acceso Denegado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-warning text-dark text-center">
                        <h1 class="h3 mb-0"><i class="fas fa-ban me-2"></i> Error 403 - Acceso Denegado</h1>
                    </div>
                    <div class="card-body text-center">
                        <h2 class="h4 text-muted">No tienes permisos para acceder a este recurso.</h2>
                        <p class="text-muted">Contacta al administrador si crees que esto es un error.</p>
                        <div class="d-grid gap-2">
                            <a th:href="@{/welcome}" class="btn btn-primary" sec:authorize="isAuthenticated()">
                                <i class="fas fa-home me-2"></i>Volver al Inicio
                            </a>
                            <a th:href="@{/login}" class="btn btn-outline-secondary" sec:authorize="isAnonymous()">
                                <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
