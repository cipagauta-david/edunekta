<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <title>Nuevo Usuario - Sistema SENA</title>
  <!-- CSS y JS -->
</head>

<body class="bg-light">
  <div th:replace="~{layout/header :: header}"></div>
  <div class="container mt-4">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-info text-white">
        <h3><i class="fas fa-user-plus me-2"></i>Nuevo Usuario</h3>
      </div>
      <div class="card-body">
        <form th:action="@{/usuarios/crear}" th:object="${usuario}" method="post" class="needs-validation" novalidate>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="nombre" class="form-label">Nombre *</label>
              <input type="text" class="form-control" th:field="*{nombre}" required />
              <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>
            <div class="col-md-6 mb-3">... (Apellido) ...</div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="email" class="form-label">Email *</label>
              <input type="email" class="form-control" th:field="*{email}" required />
              <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="col-md-6 mb-3">...</div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="password" class="form-label">Contraseña *</label>
              <input type="password" class="form-control" th:field="*{password}" required />
              <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="confirmPassword" class="form-label">Confirmar Contraseña *</label>
              <input type="password" class="form-control" th:field="*{confirmPassword}" required />
              <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                th:errors="*{confirmPassword}"></div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="gradoId" class="form-label">Grado *</label>
              <select class="form-select" th:field="*{gradoId}" required>
                <option value="">Seleccione un grado</option>
                <option th:each="grado : ${grados}" th:value="${grado.idGrado}" th:text="${grado.nombre}"></option>
              </select>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('gradoId')}" th:errors="*{gradoId}"></div>
            </div>
            <div class="col-md-4 mb-3">... (Grupo) ...</div>
            <div class="col-md-4 mb-3">... (Institución) ...</div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Crear Usuario</button>
            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
